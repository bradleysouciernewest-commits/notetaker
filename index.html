<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LocalNotes — Notes in localStorage</title>

  <!-- Roboto + Material Symbols (works from any static server) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="mui">
  <header class="app-header" role="banner">
    <div class="title">
      <span class="material-symbols-outlined icon" aria-hidden="true">note_alt</span>
      <h1>LocalNotes</h1>
    </div>

    <div class="header-controls">
      <div class="search-wrap" role="search">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
      </div>

      <div class="actions-row">
        <button id="themeToggle" class="icon-btn ripple" title="Toggle theme" aria-label="Toggle theme">
          <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
        </button>

        <button id="newNoteBtn" class="fab ripple" title="New note" aria-label="New note">
          <span class="material-symbols-outlined">add</span>
        </button>

        <div class="menu">
          <button class="menu-btn ripple" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" aria-label="More">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
          <div class="menu-popover" id="moreMenu" role="menu" aria-hidden="true">
            <button id="exportBtn" class="ripple" role="menuitem" tabindex="0"><span class="material-symbols-outlined">file_download</span> Export JSON</button>
            <label for="importFile" class="importLabel ripple" role="menuitem" tabindex="0"><span class="material-symbols-outlined">file_upload</span> Import JSON</label>
            <input id="importFile" type="file" accept="application/json" style="display:none">
            <button id="clearAllBtn" class="ripple" role="menuitem" tabindex="0"><span class="material-symbols-outlined">delete_forever</span> Clear all</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" role="main">
    <aside id="notesList" class="notes-list" aria-label="Notes list"></aside>

    <section class="editor" aria-label="Note editor">
      <form id="noteForm">

        <!-- Title: filled variant with floating label + counter + helper -->
        <div class="md-text-field filled" data-helper="A short title helps you find notes quickly">
          <input id="noteTitle" maxlength="120" autocomplete="off" aria-describedby="titleHelper titleCounter" />
          <label for="noteTitle">Note title</label>
          <div class="helper-row">
            <span class="helper" id="titleHelper">A short title helps you find notes quickly</span>
            <span class="counter" id="titleCounter" aria-live="polite">0/120</span>
          </div>
        </div>

        <!-- Content: filled textarea variant with helper -->
        <div class="md-text-field filled textarea" data-helper="Tip: use headings with # for structure">
          <textarea id="noteContent" rows="12" aria-describedby="contentHelper"></textarea>
          <label for="noteContent">Write your note...</label>
          <div class="helper-row">
            <span class="helper" id="contentHelper">Tip: use headings with # for structure</span>
          </div>
        </div>

        <div class="editor-controls">
          <label class="pin-wrap"><input id="pinCheck" type="checkbox" /> Pin</label>
          <div class="editor-actions">
            <button id="saveBtn" class="primary ripple" type="submit">Save</button>
            <button id="deleteBtn" class="danger ripple" type="button">Delete</button>
          </div>
        </div>
      </form>
      <footer class="status" id="status" aria-live="polite"></footer>
    </section>
  </main>

  <!-- Accessible live region for screen reader announcements -->
  <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Toast for animated saves -->
  <div id="toast" class="toast" aria-hidden="true"></div>

  <script src="ripple.js" type="module"></script>
  <script src="textfields.js" type="module"></script>
  <script src="app.js"></script>

  <script>
    // keyboard + accessibility for the menu
    (function(){
      const moreBtn = document.getElementById('moreBtn');
      const moreMenu = document.getElementById('moreMenu');
      if(!moreBtn || !moreMenu) return;

      const items = Array.from(moreMenu.querySelectorAll('[role="menuitem"]'));
      function openMenu(){
        moreMenu.style.display = 'flex';
        moreMenu.setAttribute('aria-hidden','false');
        moreBtn.setAttribute('aria-expanded','true');
        items[0] && items[0].focus();
        document.getElementById('srStatus').textContent = 'Menu opened';
      }
      function closeMenu(){
        moreMenu.style.display = 'none';
        moreMenu.setAttribute('aria-hidden','true');
        moreBtn.setAttribute('aria-expanded','false');
        moreBtn.focus();
        document.getElementById('srStatus').textContent = 'Menu closed';
      }

      moreBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(moreMenu.style.display === 'flex') closeMenu(); else openMenu();
      });

      moreMenu.addEventListener('keydown', (e)=>{
        const idx = items.indexOf(document.activeElement);
        if(e.key === 'ArrowDown'){
          e.preventDefault();
          const next = (idx + 1) % items.length; items[next].focus();
        }else if(e.key === 'ArrowUp'){
          e.preventDefault();
          const prev = (idx - 1 + items.length) % items.length; items[prev].focus();
        }else if(e.key === 'Escape'){
          e.preventDefault();
          closeMenu();
        }else if(e.key === 'Enter' || e.key === ' '){
          // activate
          e.preventDefault();
          document.activeElement.click();
          closeMenu();
        }
      });

      // close on outside click
      document.addEventListener('click', (e)=>{
        if(!moreBtn.contains(e.target) && !moreMenu.contains(e.target)) closeMenu();
      });
    })();

  </script>
</body>
</html>
