<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LocalNotes — Notes in localStorage</title>

  <!-- Roboto + Material Symbols (works from any static server) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="mui">
  <header class="app-header" role="banner">
    <div class="title">
      <span class="material-symbols-outlined icon" aria-hidden="true">note_alt</span>
      <h1>LocalNotes</h1>
    </div>

    <div class="header-controls">
      <div class="search-wrap" role="search">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
      </div>

      <div class="actions-row">
        <button id="newNoteBtn" class="fab" title="New note" aria-label="New note">
          <span class="material-symbols-outlined">add</span>
        </button>

        <div class="menu">
          <button class="menu-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
          <div class="menu-popover" id="moreMenu" role="menu" aria-hidden="true">
            <button id="exportBtn" role="menuitem"><span class="material-symbols-outlined">file_download</span> Export JSON</button>
            <label for="importFile" class="importLabel" role="menuitem"><span class="material-symbols-outlined">file_upload</span> Import JSON</label>
            <input id="importFile" type="file" accept="application/json" style="display:none">
            <button id="clearAllBtn" role="menuitem"><span class="material-symbols-outlined">delete_forever</span> Clear all</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" role="main">
    <aside id="notesList" class="notes-list" aria-label="Notes list"></aside>

    <section class="editor" aria-label="Note editor">
      <form id="noteForm">
        <input id="noteTitle" placeholder="Note title" maxlength="120" autocomplete="off" />
        <textarea id="noteContent" placeholder="Write your note..." rows="12"></textarea>

        <div class="editor-controls">
          <label class="pin-wrap"><input id="pinCheck" type="checkbox" /> Pin</label>
          <div class="editor-actions">
            <button id="saveBtn" type="submit" class="primary">Save</button>
            <button id="deleteBtn" type="button" class="danger">Delete</button>
          </div>
        </div>
      </form>
      <footer class="status" id="status" aria-live="polite"></footer>
    </section>
  </main>

  <script src="app.js"></script>

  <script>
    // simple menu toggle (keeps the UI working without extra libs)
    const moreBtn = document.getElementById('moreBtn');
    const moreMenu = document.getElementById('moreMenu');
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener('click', () => {
        const opened = moreMenu.style.display === 'flex';
        moreMenu.style.display = opened ? 'none' : 'flex';
        moreMenu.setAttribute('aria-hidden', opened ? 'true' : 'false');
        moreBtn.setAttribute('aria-expanded', (!opened).toString());
      });
      document.addEventListener('click', (e) => {
        if (!moreBtn.contains(e.target) && !moreMenu.contains(e.target)) {
          moreMenu.style.display = 'none';
          moreMenu.setAttribute('aria-hidden', 'true');
          moreBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }
  </script>
</body>
</html>
