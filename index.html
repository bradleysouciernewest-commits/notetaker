<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LocalNotes — Notes in localStorage</title>
  <!-- Google Fonts (Roboto) + Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mui">
  <header class="app-header">
    <div class="title">
      <span class="material-symbols-outlined icon">note_alt</span>
      <h1>LocalNotes</h1>
    </div>

    <div class="header-controls">
      <div class="search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" />
      </div>
      <button id="newNoteBtn" class="fab" title="New note"><span class="material-symbols-outlined">add</span></button>

      <div class="menu">
        <button class="menu-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false"><span class="material-symbols-outlined">more_vert</span></button>
        <div class="menu-popover" id="moreMenu" role="menu">
          <button id="exportBtn" role="menuitem"><span class="material-symbols-outlined">file_download</span> Export JSON</button>
          <label for="importFile" class="importLabel"><span class="material-symbols-outlined">file_upload</span> Import JSON</label>
          <input id="importFile" type="file" accept="application/json" style="display:none">
          <button id="clearAllBtn" role="menuitem"><span class="material-symbols-outlined">delete_forever</span> Clear all</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <aside id="notesList" class="notes-list" aria-label="Notes list"></aside>

    <section class="editor">
      <form id="noteForm">
        <input id="noteTitle" placeholder="Note title" maxlength="120" autocomplete="off" />
        <textarea id="noteContent" placeholder="Write your note..." rows="12"></textarea>
        <div class="editor-controls">
          <label class="pin-wrap"><input id="pinCheck" type="checkbox" /> Pin</label>
          <div class="actions">
            <button id="saveBtn" type="submit" class="primary">Save</button>
            <button id="deleteBtn" type="button" class="danger">Delete</button>
          </div>
        </div>
      </form>
      <footer class="status" id="status"></footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
