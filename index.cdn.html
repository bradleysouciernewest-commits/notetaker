<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LocalNotes — CDN fallback (Material Web via unpkg)</title>

  <!-- Roboto + Material Symbols (Google Fonts) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="mui">
  <!-- Import Material Web components from unpkg (CDN) so the page works without a local build step -->
  <script type="module">
    // NOTE: unpkg resolves package exports and serves ESM bundles with ?module
    import 'https://unpkg.com/@material/web/top-app-bar/top-app-bar.js?module';
    import 'https://unpkg.com/@material/web/iconbutton/filled-icon-button.js?module';
    import 'https://unpkg.com/@material/web/button/filled-button.js?module';
    import 'https://unpkg.com/@material/web/textfield/outlined-text-field.js?module';
    import 'https://unpkg.com/@material/web/textfield/filled-text-field.js?module';
    import 'https://unpkg.com/@material/web/list/list.js?module';
    import 'https://unpkg.com/@material/web/list/list-item.js?module';
  </script>

  <!-- Top app bar (Material Web components will enhance the markup if loaded) -->
  <md-top-app-bar>
    <div slot="leading" class="app-title">
      <span class="material-symbols-outlined md-icon">note_alt</span>
      <span class="title-text">LocalNotes</span>
    </div>
    <div slot="trailing" class="top-actions">
      <md-filled-icon-button id="newNoteBtn" title="New note">
        <span class="material-symbols-outlined">add</span>
      </md-filled-icon-button>
    </div>
  </md-top-app-bar>

  <main class="container">
    <aside id="notesList" class="notes-list" aria-label="Notes list"></aside>

    <section class="editor">
      <form id="noteForm">
        <md-outlined-text-field id="noteTitle" placeholder="Note title" maxlength="120"></md-outlined-text-field>
        <md-filled-text-field id="noteContent" textarea placeholder="Write your note..." rows="12"></md-filled-text-field>

        <div class="editor-controls">
          <label class="pin-wrap"><input id="pinCheck" type="checkbox" /> Pin</label>
          <div class="actions">
            <button id="saveBtn" type="submit" class="primary">Save</button>
            <button id="deleteBtn" type="button" class="danger">Delete</button>
          </div>
        </div>
      </form>
      <footer class="status" id="status" aria-live="polite"></footer>
    </section>
  </main>

  <script src="app.js" type="module"></script>
  <script>
    // menu toggle (keeps the UI working without extra libs)
    const moreBtn = document.getElementById('moreBtn');
    const moreMenu = document.getElementById('moreMenu');
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener('click', () => {
        const opened = moreMenu.style.display === 'flex';
        moreMenu.style.display = opened ? 'none' : 'flex';
        moreMenu.setAttribute('aria-hidden', opened ? 'true' : 'false');
        moreBtn.setAttribute('aria-expanded', (!opened).toString());
      });
      document.addEventListener('click', (e) => {
        if (!moreBtn.contains(e.target) && !moreMenu.contains(e.target)) {
          moreMenu.style.display = 'none';
          moreMenu.setAttribute('aria-hidden', 'true');
          moreBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }
  </script>
</body>
</html>
